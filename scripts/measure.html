<!doctype html>
<!-- Measuring page for scripts/measure.mjs (dev server only): Holler's real recorder with no chat around it. -->
<meta charset="utf-8">
<body style="margin:0;background:#111">
<canvas id="c" style="height:100vh"></canvas>
<script type="module">
import { Studio } from '/src/lib/studio.ts';
// a phone held upright hands over an upright picture; a desktop's fake camera would crop the clip to fit a wide one
const gum = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
navigator.mediaDevices.getUserMedia = c => gum(c && c.video ? { ...c, video: { width: { ideal: 720 }, height: { ideal: 1280 }, frameRate: { ideal: 30 } } } : c);
const b64 = async blob => { const u = new Uint8Array(await blob.arrayBuffer()); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
window.take = async (bits, sec, look) => {
  const s = window.s || (window.s = new Studio(document.getElementById('c')));
  await s.open();
  s.setLook(look || 'none');
  await new Promise(r => setTimeout(r, 1200));
  await s.start('video', bits ? { videoBits: bits } : {});
  await new Promise(r => setTimeout(r, sec * 1000));
  const r = await s.stop();
  return { bytes: r.blob.size, sec: r.duration, mime: r.mime, w: r.w, h: r.h, cam: [s.video.videoWidth, s.video.videoHeight], gl: s.glOk, data: await b64(r.blob) };
};
// one still of a look at full size, for judging looks on a real face
window.shot = async (look, wait = 700, amt, ctr) => {
  const s = window.s || (window.s = new Studio(document.getElementById('c')));
  if (!s.stream) await s.open();
  s.setLook(look); if (amt != null) s.amt = amt; if (ctr) s.ctr = ctr;
  await new Promise(r => setTimeout(r, wait));
  return document.getElementById('c').toDataURL('image/jpeg', 0.9).split(',')[1];
};
window.ready = true;
</script>
